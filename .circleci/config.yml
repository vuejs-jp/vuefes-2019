version: 2.1
jobs:
  build:
    docker:
      - image: cimg/node:24.2

    working_directory: ~/repo

    steps:
      - checkout

      - run:
          name: Install Vite+
          command: |
            VP_VERSION="$(node -p "require('./package.json').devDependencies['vite-plus'].replace(/^[^0-9]*/, '')")"
            curl -fsSL https://vite.plus | VP_VERSION="$VP_VERSION" VP_NODE_MANAGER=no bash
            echo 'export PATH="$HOME/.vite-plus/bin:$PATH"' >> "$BASH_ENV"

      - run:
          name: Install dependencies
          command: vp install --frozen-lockfile

      - run:
          name: Check
          command: vp check

      - run:
          name: Test
          command: vp test run

      - run:
          name: Build
          command: vp run build

workflows:
  build:
    jobs:
      - build
